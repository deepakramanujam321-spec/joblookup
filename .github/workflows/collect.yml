name: Weekday job collect

on:
  schedule:
    - cron: "30 3 * * 1-5" # 9:00 AM IST, Mon-Fri
  workflow_dispatch: {} # lets you trigger a run manually from the Actions tab

concurrency:
  group: pipeline-writes # never overlap with backfill/verify runs writing the same rows
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4

      - name: Check required secrets
        run: |
          test -n "$DATABASE_URL" || { echo "::error::DATABASE_URL secret is missing (Supabase -> Connect -> Session pooler URI). See README -> Setup."; exit 1; }

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - run: scrapling install --force

      - name: Fetch candidate postings
        run: python scripts/run_collect.py --output jobs.json
        env:
          BRAVE_API_KEY: ${{ secrets.BRAVE_API_KEY }}

      - name: Store, enrich and score
        run: python scripts/score_and_draft.py --jobs-file jobs.json
        env:
          # Provider-agnostic via LiteLLM: set ONE provider key; LLM_MODEL is
          # optional (auto-detected from whichever key is set).
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          MAX_LLM_CALLS_PER_RUN: "60"

      - name: Re-check listings are still open
        if: always()
        run: python scripts/run_verify.py --limit 150
